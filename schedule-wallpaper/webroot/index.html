<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Wallpaper Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --bg-card: #1c2640;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #2d3b59;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.25rem 2rem;
            background: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--accent-glow); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border); }
        .btn-secondary:hover { background: #263454; }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 2rem;
            padding: 2rem;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; }
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--bg-secondary);
            padding: 5px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Left Side: Preview Mockup */
        .preview-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 2rem;
            position: relative;
        }

        .phone-mockup {
            width: 320px;
            height: 710px;
            background: #000;
            border-radius: 44px;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .phone-notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 24px;
            background: #111;
            border-radius: 20px;
            z-index: 20;
        }

        #previewCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .preview-controls {
            margin-top: 1.25rem;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Right Side: Config Form */
        .controls-pane {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            max-height: 800px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent);
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .color-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .color-item span {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .color-item input[type="color"] {
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        /* Schedule Day Cards */
        .day-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            overflow: hidden;
        }

        .day-header {
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .class-list {
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .class-row {
            display: grid;
            grid-template-columns: 1fr 80px 95px 28px;
            gap: 6px;
            align-items: center;
        }

        .class-row input {
            padding: 6px 8px;
            font-size: 0.8rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
        }

        .btn-icon-del {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sticker Palette */
        .sticker-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .sticker-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 20px;
            padding: 6px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .sticker-chip:hover {
            transform: scale(1.2);
            border-color: var(--accent);
        }

        .sticker-item-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sticker-list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            <span>📅</span> Schedule Wallpaper Studio
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="loadScheduleFromDevice()">🔄 Reset / Reload</button>
            <button class="btn btn-primary" onclick="saveScheduleToDevice()">💾 Simpan ke JSON</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Left: Phone Simulator Canvas -->
        <div class="preview-pane">
            <div class="phone-mockup">
                <div class="phone-notch"></div>
                <canvas id="previewCanvas" width="1080" height="2400"></canvas>
            </div>
            <div class="preview-controls">
                <span style="font-size:0.85rem; color:var(--text-secondary)">Preview Mode:</span>
                <select id="simDaySelect" class="form-select" style="width: auto;" onchange="renderPreview()">
                    <option value="Monday">Senin (Monday)</option>
                    <option value="Tuesday">Selasa (Tuesday)</option>
                    <option value="Wednesday">Rabu (Wednesday)</option>
                    <option value="Thursday">Kamis (Thursday)</option>
                    <option value="Friday">Jumat (Friday)</option>
                </select>
            </div>
        </div>

        <!-- Right: Control Panel Tabs -->
        <div class="controls-pane">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tabSchedule')">Jadwal Kelas</button>
                <button class="tab-btn" onclick="switchTab('tabTheme')">Tema & Warna</button>
                <button class="tab-btn" onclick="switchTab('tabStickers')">Stiker & Elemen</button>
            </div>

            <!-- TAB 1: SCHEDULE -->
            <div id="tabSchedule" class="tab-content active">
                <div class="section-title">Daftar Jadwal Mingguan</div>
                <div id="daysContainer"></div>
            </div>

            <!-- TAB 2: THEME & BACKGROUND -->
            <div id="tabTheme" class="tab-content">
                <div class="section-title">Background Wallpaper</div>
                <div class="form-group">
                    <label class="form-label">Tipe Background</label>
                    <select id="bgTypeSelect" class="form-select" onchange="onBgTypeChange()">
                        <option value="color">Warna Solid (Tanpa Wallpaper)</option>
                        <option value="image">Gambar Custom (URL / File)</option>
                    </select>
                </div>

                <div id="bgColorGroup" class="form-group">
                    <label class="form-label">Warna Latar Background</label>
                    <div class="color-item">
                        <span>Background Hex</span>
                        <input type="color" id="bgColorInput" value="#000000" onchange="updateSettings('background_color', this.value)">
                    </div>
                </div>

                <div id="bgImgGroup" class="form-group" style="display:none">
                    <label class="form-label">URL Gambar Background</label>
                    <input type="text" id="bgImgInput" class="form-input" placeholder="https://... atau path gambar" oninput="updateSettings('background_image', this.value)">
                    <input type="file" id="bgFileInput" accept="image/*" style="margin-top:8px" onchange="handleBgFileUpload(event)">
                </div>

                <div class="section-title" style="margin-top:1.5rem">Skema Warna Teks</div>
                <div class="color-picker-grid">
                    <div class="color-item">
                        <span>Sedang Aktif (Highlight)</span>
                        <input type="color" id="colActiveInput" value="#FFCC00" onchange="updateSettings('color_active', this.value)">
                    </div>
                    <div class="color-item">
                        <span>Jadwal Hari Ini</span>
                        <input type="color" id="colTodayInput" value="#FFFFFF" onchange="updateSettings('color_today', this.value)">
                    </div>
                    <div class="color-item">
                        <span>Hari Lain (Dim)</span>
                        <input type="color" id="colDimInput" value="#787878" onchange="updateSettings('color_dim', this.value)">
                    </div>
                    <div class="color-item">
                        <span>Posisi Mulai Y</span>
                        <input type="number" id="startYInput" class="form-input" style="width:70px;padding:4px;" value="720" onchange="updateSettings('start_y', parseInt(this.value))">
                    </div>
                </div>
            </div>

            <!-- TAB 3: STICKERS & DECORATIONS -->
            <div id="tabStickers" class="tab-content">
                <div class="section-title">Tambah Stiker & Badge</div>
                <div class="form-label">Pilih Emoji Stiker Cepat:</div>
                <div class="sticker-palette">
                    <span class="sticker-chip" onclick="addSticker('🎓')">🎓</span>
                    <span class="sticker-chip" onclick="addSticker('💻')">💻</span>
                    <span class="sticker-chip" onclick="addSticker('⚡')">⚡</span>
                    <span class="sticker-chip" onclick="addSticker('🚀')">🚀</span>
                    <span class="sticker-chip" onclick="addSticker('☕')">☕</span>
                    <span class="sticker-chip" onclick="addSticker('🔥')">🔥</span>
                    <span class="sticker-chip" onclick="addSticker('📚')">📚</span>
                    <span class="sticker-chip" onclick="addSticker('⭐')">⭐</span>
                </div>

                <div class="section-title" style="margin-top:1.5rem">Daftar Stiker Aktif (Klik kanvas untuk geser)</div>
                <div id="stickerListContainer" class="sticker-item-list"></div>
            </div>
        </div>
    </div>

    <script>
        let currentScheduleData = {
            settings: {
                background_type: "color",
                background_color: "#000000",
                background_image: "",
                color_active: "#FFCC00",
                color_today: "#FFFFFF",
                color_dim: "#787878",
                start_y: 720,
                stickers: []
            },
            schedule: []
        };

        let bgImageObj = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function onBgTypeChange() {
            const val = document.getElementById('bgTypeSelect').value;
            currentScheduleData.settings.background_type = val;
            document.getElementById('bgColorGroup').style.display = val === 'color' ? 'block' : 'none';
            document.getElementById('bgImgGroup').style.display = val === 'image' ? 'block' : 'none';
            renderPreview();
        }

        function updateSettings(key, val) {
            currentScheduleData.settings[key] = val;
            if (key === 'background_image' && val) {
                bgImageObj = new Image();
                bgImageObj.crossOrigin = "anonymous";
                bgImageObj.src = val;
                bgImageObj.onload = () => renderPreview();
            } else {
                renderPreview();
            }
        }

        function handleBgFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    currentScheduleData.settings.background_image = dataUrl;
                    document.getElementById('bgImgInput').value = dataUrl.substring(0, 40) + '...';
                    bgImageObj = new Image();
                    bgImageObj.src = dataUrl;
                    bgImageObj.onload = () => renderPreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function addSticker(emoji) {
            const newSticker = {
                id: 'stk_' + Date.now(),
                type: 'emoji',
                content: emoji,
                x: 820,
                y: 650 + (currentScheduleData.settings.stickers.length * 70),
                size: 60,
                rotation: 0
            };
            currentScheduleData.settings.stickers.push(newSticker);
            renderStickerList();
            renderPreview();
        }

        function removeSticker(id) {
            currentScheduleData.settings.stickers = currentScheduleData.settings.stickers.filter(s => s.id !== id);
            renderStickerList();
            renderPreview();
        }

        function renderStickerList() {
            const container = document.getElementById('stickerListContainer');
            if (!container) return;
            container.innerHTML = '';
            
            if (currentScheduleData.settings.stickers.length === 0) {
                container.innerHTML = '<div style="color:var(--text-secondary);font-size:0.8rem">Belum ada stiker ditambahkan.</div>';
                return;
            }

            currentScheduleData.settings.stickers.forEach((stk, i) => {
                const row = document.createElement('div');
                row.className = 'sticker-list-row';
                row.innerHTML = `
                    <span>${stk.content} (Posisi X: ${stk.x}, Y: ${stk.y})</span>
                    <button class="btn-icon-del" onclick="removeSticker('${stk.id}')">✕</button>
                `;
                container.appendChild(row);
            });
        }

        function renderScheduleForms() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            currentScheduleData.schedule.forEach((dayGroup, dayIdx) => {
                const card = document.createElement('div');
                card.className = 'day-card';

                const header = document.createElement('div');
                header.className = 'day-header';
                header.innerHTML = `
                    <span>${dayGroup.day} (${dayGroup.classes.length} Kelas)</span>
                    <button class="btn btn-secondary" style="padding:2px 8px;font-size:0.75rem;" onclick="addClass('${dayGroup.day}')">+ Tambah</button>
                `;

                const list = document.createElement('div');
                list.className = 'class-list';

                if (dayGroup.classes.length === 0) {
                    list.innerHTML = '<div style="color:var(--text-secondary);font-size:0.8rem">Libur / Tidak ada kelas</div>';
                } else {
                    dayGroup.classes.forEach((cls, clsIdx) => {
                        const row = document.createElement('div');
                        row.className = 'class-row';
                        row.innerHTML = `
                            <input type="text" value="${cls.subject}" placeholder="Matkul" onchange="updateClass(${dayIdx}, ${clsIdx}, 'subject', this.value)">
                            <input type="text" value="${cls.room}" placeholder="Ruang" onchange="updateClass(${dayIdx}, ${clsIdx}, 'room', this.value)">
                            <input type="text" value="${cls.time}" placeholder="Jam (10:00-11:45)" onchange="updateClass(${dayIdx}, ${clsIdx}, 'time', this.value)">
                            <button class="btn-icon-del" onclick="deleteClass(${dayIdx}, ${clsIdx})">✕</button>
                        `;
                        list.appendChild(row);
                    });
                }

                card.appendChild(header);
                card.appendChild(list);
                container.appendChild(card);
            });
        }

        function updateClass(dayIdx, clsIdx, field, val) {
            currentScheduleData.schedule[dayIdx].classes[clsIdx][field] = val;
            renderPreview();
        }

        function deleteClass(dayIdx, clsIdx) {
            currentScheduleData.schedule[dayIdx].classes.splice(clsIdx, 1);
            renderScheduleForms();
            renderPreview();
        }

        function addClass(dayName) {
            const dayObj = currentScheduleData.schedule.find(d => d.day === dayName);
            if (dayObj) {
                dayObj.classes.push({ subject: "Matkul Baru", room: "Ruang", time: "08:00-10:00" });
                renderScheduleForms();
                renderPreview();
            }
        }

        function renderPreview() {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');
            const simDay = document.getElementById('simDaySelect').value;
            const settings = currentScheduleData.settings;

            // 1. Draw Background
            if (settings.background_type === 'image' && bgImageObj && bgImageObj.complete) {
                ctx.drawImage(bgImageObj, 0, 0, canvas.width, canvas.height);
                // Subtle dark overlay to keep text legible
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = settings.background_color || '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Draw Schedule Text
            let currentY = settings.start_y || 720;
            ctx.textBaseline = "middle";

            currentScheduleData.schedule.forEach(daily => {
                const isToday = daily.day.toLowerCase() === simDay.toLowerCase();
                const dayHeaderColor = isToday ? (settings.color_today || '#FFFFFF') : (settings.color_dim || '#787878');

                // Nama Hari
                ctx.font = "bold 42px 'JetBrains Mono', monospace";
                ctx.fillStyle = dayHeaderColor;
                ctx.textAlign = "left";
                ctx.fillText(daily.day.toUpperCase(), 150, currentY);
                currentY += 55;

                if (daily.classes.length === 0) {
                    ctx.font = "26px 'JetBrains Mono', monospace";
                    ctx.fillStyle = dayHeaderColor;
                    ctx.fillText("N O   C L A S S E S", 220, currentY);
                    currentY += 55;
                } else {
                    daily.classes.forEach(cls => {
                        const textColor = isToday ? (settings.color_today || '#FFFFFF') : (settings.color_dim || '#787878');
                        
                        ctx.font = "32px 'JetBrains Mono', monospace";
                        ctx.fillStyle = textColor;
                        ctx.fillText(cls.subject, 220, currentY);
                        ctx.fillText(cls.room, 560, currentY);
                        ctx.fillText(cls.time, 840, currentY);
                        currentY += 42;
                    });
                    currentY += 25;
                }
            });

            // 3. Draw Stickers
            if (settings.stickers) {
                settings.stickers.forEach(stk => {
                    if (stk.type === 'emoji') {
                        ctx.font = `${stk.size || 60}px sans-serif`;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(stk.content, stk.x, stk.y);
                    }
                });
            }
        }

        async function loadScheduleFromDevice() {
            try {
                // Try fetch from local config
                const res = await fetch('/system/etc/config/schedule.json');
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    currentScheduleData.schedule = data;
                } else {
                    currentScheduleData = data;
                }
            } catch (e) {
                console.log('Loading default config fallback');
            }
            
            // Sync controls
            if (currentScheduleData.settings) {
                document.getElementById('bgTypeSelect').value = currentScheduleData.settings.background_type || 'color';
                document.getElementById('bgColorInput').value = currentScheduleData.settings.background_color || '#000000';
                document.getElementById('colActiveInput').value = currentScheduleData.settings.color_active || '#FFCC00';
                document.getElementById('colTodayInput').value = currentScheduleData.settings.color_today || '#FFFFFF';
                document.getElementById('colDimInput').value = currentScheduleData.settings.color_dim || '#787878';
                document.getElementById('startYInput').value = currentScheduleData.settings.start_y || 720;
                onBgTypeChange();
            }

            renderScheduleForms();
            renderStickerList();
            renderPreview();
        }

        function saveScheduleToDevice() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentScheduleData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "schedule.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert("Konfigurasi schedule.json berhasil diunduh!");
        }

        window.onload = () => {
            loadScheduleFromDevice();
        };
    </script>
</body>
</html>
